<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RICAMBIO: parts that no longer exist, made again</title>
    <meta
      name="description"
      content="The shared library of 3D files for parts nobody makes anymore, and the print shop that makes them real."
    />
    <meta name="theme-color" content="#D1D7DE" />
    <script>
      // Every asset path is relative, so the page must be served from a folder URL:
      // /okul-projeleri/ricambio → /okul-projeleri/ricambio/ (query and hash kept).
      ;(function (l) {
        var p = l.pathname
        if (!/\/$/.test(p) && !/\.[a-z0-9]+$/i.test(p)) l.replace(p + '/' + l.search + l.hash)
      })(location)
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui; padding: 24px">
        RICAMBIO: the shared library of 3D files for parts nobody makes anymore, and the print shop that makes
        them real. This page needs JavaScript for its scroll story.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
